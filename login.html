<!DOCTYPE html>

<head>

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #FFFFFF;
            border: 1.5px solid #E5E7EB;

        /* Login Card */

            align-items: center;

        /* Logo */

        .welcome-title {

            font-size: 1.75rem;

            margin-top: 0.5rem;

            text-align: center;

        .dark .welcome-title {

            font-size: 0.9rem;

            font-weight: 400;

        .dark .welcome-subtitle {

</head>

<body>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="login-card">

        <!-- ===== LOGO - CENTERED ===== -->
        <div class="logo-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-12 h-12 bg-[#D4AF37] rounded-xl flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-[#0A1928] text-xl logo-icon"></i>
                </div>
                <div>
                    <span class="text-2xl font-display font-bold tracking-tight text-[#0A1928] dark:text-white">PREPELITE</span>
                </div>
            </a>
            <h1 class="welcome-title">Welcome Back</h1>
            <p class="welcome-subtitle">Sign in to continue your preparation</p>
            <div class="gold-line"></div>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form class="space-y-5" action="index.html" method="GET">

            <!-- Email field -->
            <div class="relative">
                <span class="input-icon">
                    <i class="fas fa-envelope w-5 text-sm"></i>
                </span>
                <input type="email" name="email" placeholder="Email address" required
                    class="login-input text-sm md:text-base">
            </div>

            <!-- Password field with eye toggle -->
            <div class="password-wrapper">
                <span class="input-icon">
                    <i class="fas fa-lock w-5 text-sm"></i>
                </span>
                <input type="password" id="login-password" name="password" placeholder="Password" required
                    class="login-input text-sm md:text-base">
                <button type="button" class="toggle-password" data-target="login-password"
                    aria-label="Show password">
                    <i class="far fa-eye-slash"></i>
                </button>
            </div>

            <!-- Remember me + Forgot password -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
                    <input type="checkbox" checked class="gold-checkbox rounded">
                    <span class="text-muted">Remember me</span>
                </label>
                <a href="#" class="link-gold font-medium transition">
                    Forgot password?
                </a>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn-gold mt-2">
                Sign In
                <i class="fas fa-sign-in-alt ml-2 rtl:mr-2 rtl:ml-0"></i>
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>
        </form>

        <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
        <div class="mt-4">
            <div class="grid grid-cols-2 gap-3">
                <button class="social-btn" onclick="window.location.href='index.html';">
                    <i class="fab fa-google text-base"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn" onclick="window.location.href='index.html';">
                    <i class="fab fa-apple text-base"></i>
                    <span>Apple</span>
                </button>
            </div>
        </div>

        <!-- ===== "NOT A MEMBER? SIGN UP" ===== -->
        <div class="mt-6 text-center pt-5 border-t border-[#E5E7EB] dark:border-[#2D3A46]">
            <span class="text-sm text-muted">Not a member yet?</span>
            <a href="signup.html" class="text-sm font-semibold link-gold transition ml-1 rtl:mr-1">
                Create Account
            </a>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            // ---------- THEME ----------
            const themeToggle = document.getElementById('theme-toggle');

            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const icon = themeToggle?.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-sun', 'fa-moon');
                    icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                }
                themeToggle?.classList.toggle('active', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // ---------- RTL ----------
            const rtlBtn = document.getElementById('rtl-toggle');

            function setRTL(isRTL) {
                if (isRTL) {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    rtlBtn?.classList.add('active');
                    localStorage.setItem('dir', 'rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    rtlBtn?.classList.remove('active');
                    localStorage.setItem('dir', 'ltr');
                }
            }
            const savedDir = localStorage.getItem('dir');
            savedDir === 'rtl' ? setRTL(true) : setRTL(false);

            if (rtlBtn) {
                rtlBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setRTL(document.documentElement.dir !== 'rtl');
                });
            }

            // ---------- EYE ICON TOGGLE PASSWORD ----------
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- FORGOT PASSWORD DEMO ----------
            document.querySelectorAll('a[href="#"]').forEach(link => {
                if (link.textContent.includes('Forgot') || link.innerHTML.includes('Forgot')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('A password reset link will be sent to your registered email address.');
                    });
                }
            });
        })();
    </script>
</body>
</html>
