<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up · PrepElite</title>
    <!-- Custom Favicon - Golden Crown & Graduation Cap -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A1928'/%3E%3Cpath fill='%23D4AF37' d='M25 50 L32 68 L50 48 L68 68 L75 50 L70 78 L30 78 Z'/%3E%3Ccircle cx='25' cy='48' r='3' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='46' r='4' fill='%23FFD700'/%3E%3Ccircle cx='75' cy='48' r='3' fill='%23FFD700'/%3E%3Cpath fill='%23FFD700' d='M50 18 L82 32 L50 44 L18 32 Z'/%3E%3Cpath fill='%23B4942C' d='M34 38 L34 52 C34 52 42 58 50 58 C58 58 66 52 66 52 L66 38'/%3E%3Cpath stroke='%23FFD700' stroke-width='3' fill='none' stroke-linecap='round' d='M78 33 L78 52'/%3E%3Ccircle cx='78' cy='54' r='3' fill='%23D4AF37'/%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary-navy': '#0A1928',
                        'secondary-charcoal': '#1E2A36',
                        'accent-gold': '#D4AF37',
                        'accent-gold-dark': '#B4942C',
                        'neutral-dark': '#0F1A24',
                        'neutral-light': '#F5F7FA',
                        'dark-bg': '#000000',
                        'dark-card': '#1A1A1A'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['Lexend', 'Inter', 'sans-serif']

                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',

                    keyframes: {

                        slideUp: { '0%': { transform: 'translateY(15px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

    /* Typography Hierarchy Enforcement: Heading font weight up to 600, Subheadings 400-550 */
    h1, h2, h3, h4, h5, h6, .font-display {
      font-weight: 600 !important;
    }
    .font-extrabold, .font-black, .font-bold {
      font-weight: 600 !important;
    }
    .font-semibold {
      font-weight: 600 !important;
    }
    p, .subheading, .section-subtitle, .welcome-subtitle, .lead-text {
      font-weight: 400;
    }
    .font-medium {
      font-weight: 500 !important;
    }

        /* ----- BASE STYLES ----- */
        html, body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        body {
            background: #F5F7FA;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            font-family: 'Inter', system-ui, sans-serif;
            color: #1E2A36;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .dark body {
            background: #000000;
            color: #E5E7EB;
        }

        /* Toggle Buttons - Top Right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }
        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        @media (max-width: 640px) and (min-height: 681px) {
            body {
                justify-content: flex-start !important;
                padding-top: 4.5rem !important;
                padding-bottom: 2rem !important;
            }
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }
            .signup-card {
                padding: 1.5rem 1.25rem 1.25rem !important;
                margin-top: 0.25rem !important;
            }
        }

        /* Nest Hub & Short Viewport Height (<= 680px) */
        @media (max-height: 680px) {
            body {
                padding: 0.5rem !important;
                justify-content: center !important;
            }
            .signup-card {
                padding: 1.25rem 2rem 1.1rem !important;
                max-width: 440px !important;
                border-radius: 20px !important;
            }
            .logo-center {
                margin-bottom: 0.4rem !important;
            }
            .welcome-title {
                font-size: 1.3rem !important;
                margin-top: 0.2rem !important;
                margin-bottom: 0.1rem !important;
            }
            .welcome-subtitle {
                font-size: 0.8rem !important;
                margin-bottom: 0.25rem !important;
            }
            .gold-line {
                margin: 0.3rem auto 0.4rem !important;
            }
            .signup-input {
                padding: 0.65rem 1rem 0.65rem 3.1rem !important;
                font-size: 0.88rem !important;
                border-radius: 10px !important;
            }
            .input-icon {
                left: 0 !important;
                width: 3.1rem !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            .password-wrapper .signup-input {
                padding-right: 3.1rem !important;
            }
            .toggle-password {
                right: 0.85rem !important;
                top: 50% !important;
                transform: translateY(-50%) !important;
            }
            .space-y-3 > :not([hidden]) ~ :not([hidden]) {
                margin-top: 0.45rem !important;
            }
            .btn-gold {
                padding: 0.65rem 1rem !important;
                font-size: 0.88rem !important;
                border-radius: 10px !important;
            }
            .social-btn {
                padding: 0.55rem 0.85rem !important;
                font-size: 0.85rem !important;
                border-radius: 10px !important;
            }
            .divider {
                margin: 0.5rem 0 !important;
            }
            .terms-text {
                font-size: 0.76rem !important;
            }
            .theme-toggle-wrapper {
                top: 10px !important;
                right: 10px !important;
                transform: scale(0.9);
            }
        }

        .toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #FFFFFF;
            border: 1.5px solid #E5E7EB;
            color: #1E2A36;
            font-size: 0.95rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .dark .toggle-btn {
            background: #1A1A1A;
            border-color: #2D3A46;
            color: #E5E7EB;
        }
        .toggle-btn:hover {
            background: #D4AF37;
            color: #0A1928;
            border-color: #D4AF37;
        }

        /* Perfectly Balanced Signup Card */
        .signup-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 1.75rem 2.25rem 1.5rem;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.08);
            width: 100%;
            max-width: 440px;
            margin: auto;
            animation: slideUp 0.4s ease-out;
            box-sizing: border-box;
        }
        .dark .signup-card {
            background: #1A1A1A;
            border-color: rgba(212, 175, 55, 0.1);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.3);
        }

        /* Logo Area */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .welcome-title {
            font-family: 'Lexend', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0A1928;
            margin-top: 0.35rem;
            margin-bottom: 0.15rem;
            text-align: center;
            line-height: 1.2;
        }
        .dark .welcome-title {
            color: #E5E7EB;
        }
        .welcome-subtitle {
            font-size: 0.85rem;
            color: #6B7280;
            text-align: center;
            margin-bottom: 0.35rem;
            font-weight: 400;
        }
        .dark .welcome-subtitle {
            color: #9CA3AF;
        }
        .gold-line {
            width: 45px;
            height: 3px;
            background: #D4AF37;
            margin: 0.4rem auto;
            border-radius: 2px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0 0.75rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E7EB;
        }
        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: #2D3A46;
        }
        .divider span {
            font-size: 0.725rem;
            padding: 0 0.85rem;
            color: #6B7280;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .dark .divider span {
            color: #9CA3AF;
        }

        /* Inputs & Vertical Icon Center Fix */
        .signup-input {
            width: 100%;
            height: 48px;
            padding: 0 1.2rem 0 3rem;
            border-radius: 12px;
            border: 1.5px solid #E5E7EB;
            background: #FAFBFC;
            font-size: 0.95rem;
            line-height: 48px;
            transition: all 0.2s;
            color: #1E2A36;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        .dark .signup-input {
            background: #0D0D0D;
            border-color: #2D3A46;
            color: #E5E7EB;
        }
        .signup-input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
        .dark .signup-input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
        .signup-input::placeholder {
            color: #9CA3AF;
        }
        .dark .signup-input::placeholder {
            color: #6B7280;
        }

        /* PERFECT VERTICAL ICON ALIGNMENT */
        .input-icon {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9CA3AF;
            pointer-events: none;
            z-index: 5;
        }
        .dark .input-icon {
            color: #6B7280;
        }
        [dir="rtl"] .input-icon {
            left: auto;
            right: 0;
        }
        [dir="rtl"] .signup-input {
            padding: 0 3rem 0 1.2rem;
        }

        .relative {
            position: relative;
        }

        /* Password Toggle */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper .signup-input {
            padding-right: 3rem;
        }
        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9CA3AF;
            font-size: 1rem;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .dark .toggle-password {
            color: #6B7280;
        }
        .toggle-password:hover {
            color: #D4AF37;
        }
        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        /* Gold Button */
        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B4942C 100%);
            color: #0A1928;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.22);
        }
        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.32);
        }

        /* Social Buttons */
        .social-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 12px;
            border: 1.5px solid #E5E7EB;
            background: #FFFFFF;
            color: #1E2A36;
            font-weight: 500;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .dark .social-btn {
            background: #0D0D0D;
            border-color: #2D3A46;
            color: #E5E7EB;
        }
        .social-btn:hover {
            background: #F5F7FA;
            border-color: #D4AF37;
        }
        .dark .social-btn:hover {
            background: #1A1A1A;
            border-color: #D4AF37;
        }

        /* Checkbox & Terms */
        .gold-checkbox {
            accent-color: #D4AF37;
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        .terms-text {
            font-size: 0.775rem;
            color: #6B7280;
            line-height: 1.35;
        }
        .dark .terms-text {
            color: #9CA3AF;
        }
        .link-gold {
            color: #D4AF37;
            font-weight: 500;
            text-decoration: none;
        }
        .link-gold:hover {
            color: #B4942C;
            text-decoration: underline;
        }

        .space-y-3 > :not([hidden]) ~ :not([hidden]) {
            margin-top: 0.75rem;
        }
    </style>
</head>

<body>

    <!-- ===== THEME TOGGLES ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="signup-card">

        <!-- ===== LOGO - CENTERED ===== -->
        <div class="logo-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-11 h-11 bg-[#D4AF37] rounded-xl flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-[#0A1928] text-xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-display font-bold tracking-tight text-[#0A1928] dark:text-white">PREPELITE</span>
                </div>
            </a>
            <h1 class="welcome-title">Create Account</h1>
            <p class="welcome-subtitle">Start your journey to success today</p>
            <div class="gold-line"></div>
        </div>

        <!-- ===== SIGNUP FORM ===== -->
        <form class="space-y-3" onsubmit="event.preventDefault(); alert('Welcome to PrepElite! Your account has been created.'); window.location.href='login.html';">

            <!-- Full Name -->
            <div class="relative">
                <span class="input-icon">
                    <i class="fas fa-user text-sm"></i>
                </span>
                <input type="text" name="name" placeholder="Full name" required class="signup-input">
            </div>

            <!-- Email -->
            <div class="relative">
                <span class="input-icon">
                    <i class="fas fa-envelope text-sm"></i>
                </span>
                <input type="email" name="email" placeholder="Email address" required class="signup-input">
            </div>

            <!-- Password with eye toggle -->
            <div class="password-wrapper">
                <span class="input-icon">
                    <i class="fas fa-lock text-sm"></i>
                </span>
                <input type="password" id="signup-password" name="password" placeholder="Password" required class="signup-input">
                <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password">
                    <i class="far fa-eye-slash"></i>
                </button>
            </div>

            <!-- Confirm Password with eye toggle -->
            <div class="password-wrapper">
                <span class="input-icon">
                    <i class="fas fa-lock text-sm"></i>
                </span>
                <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Confirm password" required class="signup-input">
                <button type="button" class="toggle-password" data-target="signup-confirm-password" aria-label="Show password">
                    <i class="far fa-eye-slash"></i>
                </button>
            </div>

            <!-- Terms & Conditions -->
            <div class="flex items-start space-x-2 rtl:space-x-reverse pt-0.5">
                <input type="checkbox" id="terms" class="gold-checkbox mt-0.5" required>
                <label for="terms" class="terms-text">
                    I agree to the <a href="#" class="link-gold">Terms of Service</a> and <a href="#" class="link-gold">Privacy Policy</a>
                </label>
            </div>

            <!-- SIGN UP BUTTON WITH RIGHT-SIDE ICON -->
            <button type="submit" class="btn-gold mt-2">
                Create Account
                <i class="fas fa-user-plus ml-2 rtl:mr-2 rtl:ml-0 text-sm"></i>
            </button>
        </form>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span>or sign up with</span>
        </div>

        <!-- ===== SOCIAL BUTTONS ===== -->
        <div class="grid grid-cols-2 gap-3">
            <button class="social-btn" id="googleSignupBtn">
                <i class="fab fa-google"></i>
                <span>Google</span>
            </button>
            <button class="social-btn" id="appleSignupBtn">
                <i class="fab fa-apple"></i>
                <span>Apple</span>
            </button>
        </div>

        <!-- ===== LOGIN LINK ===== -->
        <div class="mt-4 text-center pt-3 border-t border-[#E5E7EB] dark:border-[#2D3A46]">
            <span class="text-xs text-gray-500 dark:text-gray-400">Already have an account?</span>
            <a href="login.html" class="text-xs font-semibold link-gold transition ml-1 rtl:mr-1">
                Sign In
            </a>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            // ---------- THEME ----------
            const themeToggle = document.getElementById('theme-toggle');

            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const icon = themeToggle?.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-sun', 'fa-moon');
                    icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                }
                themeToggle?.classList.toggle('active', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // ---------- RTL ----------
            const rtlBtn = document.getElementById('rtl-toggle');

            function setRTL(isRTL) {
                if (isRTL) {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    rtlBtn?.classList.add('active');
                    localStorage.setItem('dir', 'rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    rtlBtn?.classList.remove('active');
                    localStorage.setItem('dir', 'ltr');
                }
            }
            const savedDir = localStorage.getItem('dir');
            savedDir === 'rtl' ? setRTL(true) : setRTL(false);

            if (rtlBtn) {
                rtlBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setRTL(document.documentElement.dir !== 'rtl');
                });
            }

            // ---------- EYE ICON TOGGLE PASSWORD ----------
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- SOCIAL BUTTONS ----------
            const googleBtn = document.getElementById('googleSignupBtn');
            const appleBtn = document.getElementById('appleSignupBtn');

            if (googleBtn) {
                googleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('Google sign-up is a demo feature in this preview.');
                });
            }
            if (appleBtn) {
                appleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('Apple sign-up is a demo feature in this preview.');
                });
            }
        })();
    </script>
</body>
</html>
